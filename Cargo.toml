[package]
name = "xml_file_splitter"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/ialarmedalien/xml_file_splitter"

[dependencies]
quick-xml = "0.40.1"
flate2 = "1.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

[lib]
name = "xml_file_splitter"
path = "src/lib.rs"

[[bin]]
name = "xml_file_splitter"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
anyhow   = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
